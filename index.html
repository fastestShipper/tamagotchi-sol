<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BROKE DEV · fund the grind with SOL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame">
  <header>
    <h1>BROKE DEV</h1>
    <div class="net" id="net-status">NET: OFF</div>
  </header>

  <div class="screen-wrap">
    <canvas id="game" width="160" height="100"></canvas>
    <div class="bubble hidden" id="bubble"></div>
    <div class="alert hidden" id="alert">
      <img id="alert-icon" alt="">
      <div>
        <div class="alert-title" id="alert-title"></div>
        <div class="alert-sub" id="alert-sub"></div>
      </div>
    </div>
    <div class="death hidden" id="death">
      <div class="death-title" id="death-title">SHIPPED</div>
      <div class="death-sub" id="death-sub"></div>
      <div class="death-stats" id="death-stats"></div>
      <button id="restart-btn">KEEP BUILDING →</button>
    </div>
  </div>

  <div class="hud">
    <div class="goal-row">
      <div class="goal-head">
        <span class="goal-label" id="goal-label">SHIP GAME #1</span>
        <span id="goal-num">0.000 / 1 SOL</span>
      </div>
      <div class="goal-bar"><div id="goal-fill"></div></div>
    </div>
    <div class="energy-row">
      <span class="label">STAMINA</span>
      <div class="energy-bar"><div id="energy-fill"></div></div>
      <span id="energy-num">100</span>
    </div>
    <div class="donate">
      <span class="label">FUEL THE GRIND (SOL) →</span>
      <code id="wallet-addr">set your address in solana.js</code>
      <button id="copy-btn">COPY</button>
    </div>
    <div class="tiers" id="tiers"></div>
    <div class="stats" id="stats"></div>
  </div>

  <details class="demo">
    <summary>demo mode (test without SOL)</summary>
    <div class="demo-btns" id="demo-btns"></div>
  </details>
</div>

<script src="dev-sprites.js"></script>
<script src="game.js"></script>
<script src="solana.js"></script>
<script src="ui.js"></script>
</body>
</html>
